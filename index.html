<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be the Mayor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.87.0/phaser.min.js"
        integrity="sha512-e251dDfxfj70o3iWsf84M612cWbWdTXjVbFXA7MavobTcKB1sCLV+WNiduc20UrpWLXRgi1tgob1TOAfySx9Xg=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script defer src="game.js"></script>
    <style>
        body {
            margin: 0;
            background-color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        canvas {
            display: block;
            margin: auto;
            border: 1px solid black;
        }

        #ui-container {
            margin-top: 10px;
            color: white;
        }

        label {
            margin-right: 5px;
        }
    </style>
</head>

<body>
    <div id="phaser-game"></div>

    <div id="ui-container">
        <label for="building-select">Build:</label>
        <select id="building-select">
            <option value="">-- Select Building --</option>
        </select>
        <button type="submit">Save</button>
        <button type="reset">Reset</button>
    </div>

</body>

</html>
